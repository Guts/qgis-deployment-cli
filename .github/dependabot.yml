version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
      time: "17:00"
      timezone: Europe/Paris
    labels:
      - dependencies
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 10
      semver-patch-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - ci-cd
    cooldown:
      default-days: 14
